apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cases-store-mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cases-store-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cases-store-mongo
  template:
    metadata:
      labels:
        app: cases-store-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: cases-store-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: cases-store-mongo
  ports:
    - port: 27017
      targetPort: 27017

